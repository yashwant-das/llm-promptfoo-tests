# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: 'Translation Evaluation — Local Models'

# ── Providers (local) ───────────────────────────────────────────────
providers:
  - id: ollama:gpt-oss:20b
    label: GPT-OSS 20B
    config:
      temperature: 0.3

# ── Prompts ────────────────────────────────────────────────────────
prompts:
  - id: file://prompts/direct.txt
    label: Direct (default)
  - id: file://prompts/detailed.txt
    label: Detailed
  - id: file://prompts/code_mixing.txt
    label: Code-Aware

# ── Tests ──────────────────────────────────────────────────────────
tests:
  - file://tests/translations.yaml
  - file://tests/edge_cases.yaml

# ── Scoring ────────────────────────────────────────────────────────
defaultTest:
  assert:
    - type: javascript
      value: "return output.length > 0 && output.trim() !== ''"
      weight: 0
      threshold: 1

# ── Output ─────────────────────────────────────────────────────────
output: outputs/results.json
results: outputs/results-latest.csv
